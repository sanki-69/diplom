# Render's free plan puts the backend to sleep after ~15 idle minutes, and the
# first visitor then waits ~1 minute. This pings /health every 10 minutes so it
# stays awake (the daily price scrape also needs it awake at 03:00).
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables
#        → New variable  BACKEND_URL = https://your-backend.onrender.com
# One always-on service uses ~744 of Render's 750 free hours per month.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 120 --retry 2 "${{ vars.BACKEND_URL }}/health" > /dev/null
